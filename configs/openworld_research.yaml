protocol:
  id: openplant_leaf14_v2
  seed: 42
  status: experimental_scaffold
  claim_boundary: >-
    Expandable known-plant recognition with explicit unknown rejection; not universal
    botanical identification and not a professional diagnosis.

data:
  manifest: configs/openworld_manifest.example.jsonl
  group_key: entity_id
  required_metadata: [source, license]
  recommended_group_keys: [observer_id, site_id]
  splits: [train, validation, test, ood_validation, ood_test]

catalog:
  organ_scope: single_clear_leaf
  known_species_count: 14
  minimum_ood_species_count: 6
  known_species:
    - malus_domestica
    - vaccinium_corymbosum
    - prunus_cerasus
    - zea_mays
    - vitis_vinifera
    - citrus_sinensis
    - prunus_persica
    - capsicum_annuum
    - solanum_tuberosum
    - rubus_idaeus
    - glycine_max
    - cucurbita_pepo
    - fragaria_ananassa
    - solanum_lycopersicum
  excluded_inputs: [multiple_overlapping_leaves, flower, fruit, stem_only, whole_plant]

leaf_preparation:
  method: opencv_exg_single_leaf_v1
  training_and_inference_match: true
  output_background_rgb: [124, 124, 124]
  rejection_gates:
    minimum_leaf_coverage_percent: 5
    maximum_leaf_coverage_percent: 90
    minimum_component_dominance: 0.60
    maximum_border_touch_ratio: 0.18
  shape_features: [aspect_ratio, circularity, solidity, extent]

plant_identity:
  default_encoder: torchvision/mobilenet_v2-imagenet1k-v2
  encoder_trainable: false
  input_size: 224
  max_prototypes_per_class: 3
  score: maximum_prototype_cosine_similarity
  rejection_gates: [similarity, top1_top2_margin]
  calibration_split: ood_validation
  candidates:
    - plantnet_resnet18
    - dinov2_vits14
    - mobileclip2_s0

condition_routing:
  route_only_after_plant_acceptance: true
  missing_host_model_action: withhold_condition
  default_model: host_specific_prototype_or_linear_probe
  minimum_conditions_per_host: 2
  inputs: [isolated_leaf, leaf_constrained_lesion_crops]

localization:
  stage_0: opencv_leaf_mask_then_colour_morphology_boxes
  supervised_candidate: plantseg_mask_model
  claim_boundary: candidate lesion pixels, not causal disease localization

evaluation:
  closed_set: [top1_accuracy, top5_accuracy, macro_recall, tail_group_recall]
  open_set: [auroc, aupr_out, fpr95, oscr, unknown_false_accept_rate]
  hierarchical: [plant_accuracy, conditional_condition_macro_f1, end_to_end_macro_f1]
  report_per_source: true

compute_profiles:
  tiny:
    hardware: CPU or Apple Silicon with 8-16 GiB unified memory
    method: frozen MobileNetV2 embeddings plus prototypes
    gradients: false
  small:
    hardware: Apple Silicon or one 8-16 GiB GPU
    method: frozen DINOv2 ViT-S/14 or MobileCLIP2-S0 plus prototypes/linear probe
    gradients: linear head only
  optional_finetune:
    hardware: one 16-24 GiB GPU
    method: parameter-efficient domain adaptation after frozen baselines
    gradients: adapters or final blocks only
